<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas para Jaqueline</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2b0318; /* Fondo oscuro romántico de pantalla */
            background-image: radial-gradient(#4d0a2d 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .card {
            background-color: #fcf6eb;
            width: 100%;
            max-width: 380px;
            border-radius: 25px;
            padding: 30px 25px 20px 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .content-layout {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 25px;
            position: relative;
        }

        .text-section {
            width: 55%;
            text-align: left;
            z-index: 2;
        }

        .text-section h2 {
            font-size: 0.9rem;
            color: #4a3b32;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .text-section p {
            font-size: 0.8rem;
            color: #5c4a3e;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .signature {
            font-size: 0.85rem;
            color: #7a5c48;
            font-style: italic;
            margin-top: 15px;
        }

        /* --- ÁRBOL DE CORAZÓN --- */
        .tree-container {
            width: 45%;
            height: 180px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .trunk {
            width: 14px;
            height: 90px;
            background: #5c3a21;
            border-radius: 4px;
            position: relative;
            z-index: 1;
        }

        .heart-crown {
            position: absolute;
            top: 5px;
            width: 140px;
            height: 130px;
            z-index: 2;
        }

        /* Contenedor dinámico de flores */
        .flower-leaf {
            position: absolute;
            font-size: 11px;
            user-select: none;
            animation: pulse 3s infinite ease-in-out;
        }

        /* --- SECCIÓN DEL CONTADOR --- */
        .counter-section {
            border-top: 1px solid #e0d5c1;
            padding-top: 12px;
            text-align: left;
        }

        .counter-title {
            font-size: 0.8rem;
            color: #4a3b32;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .counter-display {
            font-size: 0.85rem;
            color: #2c1e16;
            font-weight: bold;
        }

        .counter-display span {
            font-size: 0.9rem;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="content-layout">
            <!-- Texto a la izquierda -->
            <div class="text-section">
                <h2>Flores Amarillas para el amor de mi vida:</h2>
                <p>Si pudiera elegir un lugar seguro, sería a tu lado.</p>
                <p>Cuanto más tiempo estoy contigo más te amo.</p>
                <div class="signature">— I Love You!</div>
            </div>

            <!-- Árbol a la derecha -->
            <div class="tree-container">
                <div class="heart-crown" id="heartCrown"></div>
                <div class="trunk"></div>
            </div>
        </div>

        <!-- Contador inferior en vivo -->
        <div class="counter-section">
            <div class="counter-title">
                🌻 Mi amor por ti comenzó hace...
            </div>
            <div class="counter-display" id="timer">
                487 días 00 horas 00 minutos 00 segundos
            </div>
        </div>
    </div>

    <script>
        // Generar la copa de árbol con forma de corazón llena de flores amarillas
        const heartCrown = document.getElementById('heartCrown');
        const totalFlowers = 90;

        for (let i = 0; i < totalFlowers; i++) {
            // Ecuación paramétrica de un corazón
            const t = Math.random() * Math.PI * 2;
            const r = Math.sqrt(Math.random()); // Distribución uniforme dentro de la forma
            
            // Puntos en forma de corazón
            const x = r * 16 * Math.pow(Math.sin(t), 3);
            const y = -r * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

            const flower = document.createElement('span');
            flower.classList.add('flower-leaf');
            flower.innerHTML = '🌻';

            // Escalar y posicionar dentro del contenedor
            const posX = 65 + (x * 3.5);
            const posY = 55 + (y * 3.5);

            flower.style.left = `${posX}px`;
            flower.style.top = `${posY}px`;
            flower.style.animationDelay = `${Math.random() * 2}s`;
            flower.style.fontSize = `${8 + Math.random() * 6}px`;

            heartCrown.appendChild(flower);
        }

        // Lógica del contador de tiempo transcurrido (1 año y 4 meses = 487 días exactos)
        // Fecha base configurada para reflejar el tiempo juntos
        const startDate = new Date();
        startDate.setDate(startDate.getDate() - 487); 

        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById('timer').innerHTML = 
                `${days} días ${hours < 10 ? '0' : ''}${hours} horas ${minutes < 10 ? '0' : ''}${minutes} minutos ${seconds < 10 ? '0' : ''}${seconds} segundos`;
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
